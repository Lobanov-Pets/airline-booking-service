spring.application.name=airline-booking-service

spring.datasource.url=jdbc:postgresql://localhost:5433/demo
spring.datasource.username=local
spring.datasource.password=local
spring.jpa.properties.hibernate.default_schema=bookings
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true